name: ngo_website
description: "A modern NGO website built with Flutter Web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: 
  # Routing
  go_router: ^14.2.0

  # Fonts
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

  # Scroll-triggered animations (used from Phase 2 onward)
  flutter_animate: ^4.5.0
  visibility_detector: ^0.4.0+2
  web: ^1.1.1
 
 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true 
  uses-material-design: true

  # Uncomment and add real asset paths once images are added in Phase 2/3
  assets:
    - assets/images/
    - assets/team/
    - assets/icons/
